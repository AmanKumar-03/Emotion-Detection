name: Emotion Detection CI


on:

  push:
    branches:
      - master

  pull_request:
    branches:
      - master



jobs:

  build-test:


    runs-on: ubuntu-latest


    steps:


    # Checkout repository
    - name: Checkout code
      uses: actions/checkout@v4



    # Setup Python
    - name: Setup Python
      uses: actions/setup-python@v5

      with:

        python-version: "3.12"



    # Install dependencies
    - name: Install dependencies
      run: |

        python -m pip install --upgrade pip

        pip install -r app/backend/requirements.txt

        pip install -r app/frontend/requirements.txt

        pip install dvc



    # Run DVC Pipeline
    - name: Run DVC Pipeline
      run: |

        dvc repro



    # Check generated files
    - name: Check Pipeline Output
      run: |

        ls data

        ls artifacts



    # Syntax validation
    - name: Python Syntax Check
      run: |

        python -m compileall src app



    # FastAPI Test
    - name: Test FastAPI Backend
      run: |

        cd app/backend

        python -c "

        from main import app

        print('FastAPI loaded successfully')

        "