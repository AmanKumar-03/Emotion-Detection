name: Emotion Detection CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: self-hosted

    steps:

    - name: Checkout code
      uses: actions/checkout@v4


    - name: Install DVC
      run: |
        pip install dvc


    - name: Run DVC Pipeline
      run: |
        dvc repro


    - name: Copy artifacts for backend Docker build
      run: |
        mkdir -p app/backend/artifacts
        cp artifacts/model.pkl app/backend/artifacts/
        cp artifacts/vectorizer.pkl app/backend/artifacts/


    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}


    - name: Build Backend Image
      run: |
        docker build \
        -t amankumar03/emotion-detection-backend:v1.0.2 \
        ./app/backend


    - name: Build Frontend Image
      run: |
        docker build \
        -t amankumar03/emotion-detection-frontend:v1.0.2 \
        ./app/frontend


    - name: Push Backend Image
      run: |
        docker push amankumar03/emotion-detection-backend:v1.0.2


    - name: Push Frontend Image
      run: |
        docker push amankumar03/emotion-detection-frontend:v1.0.2


    - name: Deploy Kubernetes
      run: |
        kubectl apply -f k8s/