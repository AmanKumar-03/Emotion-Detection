name: Emotion Detection CI/CD


on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main



jobs:

  docker-build-push:


    runs-on: ubuntu-latest


    steps:


    # Checkout repository

    - name: Checkout code

      uses: actions/checkout@v4



    # Login Docker Hub

    - name: Docker Login

      uses: docker/login-action@v3

      with:

        username: ${{ secrets.DOCKER_USERNAME }}

        password: ${{ secrets.DOCKER_PASSWORD }}



    # Build Backend Image

    - name: Build Backend Image

      run: |

        docker build \
        -t ${{ secrets.DOCKER_USERNAME }}/emotion-detection-backend:latest \
        ./app/backend



    # Build Frontend Image

    - name: Build Frontend Image

      run: |

        docker build \
        -t ${{ secrets.DOCKER_USERNAME }}/emotion-detection-frontend:latest \
        ./app/frontend



    # Push Backend Image

    - name: Push Backend Image

      run: |

        docker push \
        ${{ secrets.DOCKER_USERNAME }}/emotion-detection-backend:latest



    # Push Frontend Image

    - name: Push Frontend Image

      run: |

        docker push \
        ${{ secrets.DOCKER_USERNAME }}/emotion-detection-frontend:latest