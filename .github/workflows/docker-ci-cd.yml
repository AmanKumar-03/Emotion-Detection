name: Emotion Detection CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-and-deploy:

    runs-on: self-hosted

    steps:

    - name: Checkout code
      uses: actions/checkout@v4


    - name: Install DVC
      shell: powershell
      run: |
        pip install dvc


    - name: Run DVC Pipeline
      shell: powershell
      run: |
        dvc repro


    - name: Prepare Backend Artifacts
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path app/backend/artifacts

        Copy-Item artifacts/model.pkl app/backend/artifacts/
        Copy-Item artifacts/vectorizer.pkl app/backend/artifacts/


    - name: Verify Backend Files
      shell: powershell
      run: |
        Get-ChildItem app/backend/artifacts


    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}


    - name: Build Backend Image
      shell: powershell
      run: |
        docker build `
        -t amankumar03/emotion-detection-backend:v1.0.2 `
        ./app/backend


    - name: Build Frontend Image
      shell: powershell
      run: |
        docker build `
        -t amankumar03/emotion-detection-frontend:v1.0.2 `
        ./app/frontend


    - name: Push Backend Image
      shell: powershell
      run: |
        docker push amankumar03/emotion-detection-backend:v1.0.2


    - name: Push Frontend Image
      shell: powershell
      run: |
        docker push amankumar03/emotion-detection-frontend:v1.0.2


    - name: Update Kubernetes Images
      shell: powershell
      run: |
        kubectl set image deployment/emotion-backend `
        backend=amankumar03/emotion-detection-backend:v1.0.2 `
        -n emotion-detection

        kubectl set image deployment/emotion-frontend `
        frontend=amankumar03/emotion-detection-frontend:v1.0.2 `
        -n emotion-detection


    - name: Deploy Kubernetes Manifests
      shell: powershell
      run: |
        kubectl apply -f k8s/
        

    - name: Check Kubernetes Status
      shell: powershell
      run: |
        kubectl get pods -n emotion-detection
        kubectl get svc -n emotion-detection