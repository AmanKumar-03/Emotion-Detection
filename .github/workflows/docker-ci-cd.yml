name: Emotion Detection CI/CD


on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# Cancel old running builds
concurrency:
  group: emotion-detection-ci
  cancel-in-progress: true


jobs:

  docker-build-push:

    runs-on: ubuntu-latest


    steps:

    # Checkout repository
    - name: Checkout code
      uses: actions/checkout@v4


    # Setup Docker Buildx (for cache)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3


    # Login Docker Hub
    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}


    # Build and Push Backend
    - name: Build and Push Backend Image
      uses: docker/build-push-action@v6
      with:
        context: ./app/backend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/emotion-detection-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max


    # Build and Push Frontend
    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v6
      with:
        context: ./app/frontend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/emotion-detection-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max