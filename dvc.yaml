stages:

  data_ingestion:
    cmd: python src/data/data_ingestion.py
    deps:
      - src/data/data_ingestion.py
      - params.yaml
    outs:
      - data/raw/train.csv
      - data/raw/test.csv


  data_preprocessing:
    cmd: python src/data/data_preprocessing.py
    deps:
      - src/data/data_preprocessing.py
      - data/raw/train.csv
      - data/raw/test.csv
    outs:
      - data/interim/train_processed.csv
      - data/interim/test_processed.csv


  feature_engineering:
    cmd: python src/features/feature_engineering.py
    deps:
      - src/features/feature_engineering.py
      - data/interim/train_processed.csv
      - data/interim/test_processed.csv
      - params.yaml
    params:
      - feature_engineering.max_features
      - feature_engineering.ngram_min
      - feature_engineering.ngram_max
      - feature_engineering.min_df
      - feature_engineering.max_df
    outs:
      - data/processed/train_tfidf.csv
      - data/processed/test_tfidf.csv


  model_building:
    cmd: python src/model/model_building.py
    deps:
      - src/model/model_building.py
      - data/processed/train_tfidf.csv
      - params.yaml
    params:
      - model_building.model_type
      - model_building.C
      - model_building.max_iter
    outs:
      - models/model.pkl


  model_evaluation:
    cmd: python src/model/model_evaluation.py
    deps:
      - src/model/model_evaluation.py
      - models