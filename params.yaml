data_ingestion:
  test_size: 0.2
  random_state: 42

data_preprocessing:
  remove_stopwords: true
  lemmatization: true
  remove_small_sentences: true
  min_words: 3

feature_engineering:
  vectorizer: bow
  max_features: 5000
  ngram_min: 1
  ngram_max: 2
  min_df: 2
  max_df: 0.95

model_building:
  model_type: logistic_regression
  C: 1.0
  max_iter: 5000

