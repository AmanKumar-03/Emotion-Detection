data_ingestion:
  test_size: 0.2
  random_state: 42


data_preprocessing:
  remove_stopwords: true
  lemmatization: true
  remove_small_sentences: true
  min_words: 3


feature_engineering:
  vectorizer: tfidf
  max_features: 5000
  ngram_min: 1
  ngram_max: 2
  min_df: 2
  max_df: 0.95
  vectorizer_path: artifacts/vectorizer.pkl


model_building:
  model_type: logistic_regression
  random_state: 42
  class_weight: balanced
  C: 1
  solver: lbfgs
  max_iter: 500
  model_path: artifacts/model.pkl


model_evaluation:
  average_method: weighted
  save_confusion_matrix: true
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
  report_path: reports/


model_registry:
  model_name: Emotion_Detection_Model1
  minimum_accuracy: 0.25
  minimum_f1_score: 0.25
  alias: champion